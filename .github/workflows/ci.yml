name: Cross-platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.11', '3.14']
        include:
          - os: ubuntu-latest
            python: '3.10'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ./cli
      - run: python -m unittest discover -s cli/tests -v
      - run: python tools/package_plugin.py

  plugin:
    name: Release plugin syntax and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update
      - run: sudo apt-get install -y lua5.4
      - run: luac5.4 -p plugin/AzureSlop.lua
      - run: python3 tools/package_plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: AzureSlop-plugin
          path: dist/AzureSlop.rbxmx
